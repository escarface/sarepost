openapi: 3.1.0
info:
  title: PostFlow API
  version: 0.2.0
  description: v2 API for multi-network, multi-account publishing via account_id.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
  - apiKeyAuth: []
  - basicAuth: []
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /accounts:
    get:
      summary: List connected/registered accounts
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'

  /accounts/static:
    post:
      summary: Create or update a static account for LinkedIn, Facebook, or Instagram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaticAccountRequest'
      responses:
        '201':
          description: Account created/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'

  /accounts/{id}/disconnect:
    post:
      summary: Mark an account as disconnected
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Disconnected account
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    example: disconnected
        '404':
          $ref: '#/components/responses/Error'

  /accounts/{id}/connect:
    post:
      summary: Mark an account as connected
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Connected account
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    example: connected
        '404':
          $ref: '#/components/responses/Error'

  /accounts/{id}/x-premium:
    post:
      summary: Set X premium flag (X accounts only)
      parameters:
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x_premium]
              properties:
                x_premium:
                  type: boolean
      responses:
        '200':
          description: X premium updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  x_premium:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /accounts/{id}:
    delete:
      summary: Delete a disconnected account with no linked posts
      parameters:
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /oauth/{platform}/start:
    post:
      summary: Start OAuth for a supported platform
      description: Supported OAuth platforms are x, linkedin, facebook, and instagram. For LinkedIn, omit `account_kind` or set `personal` for profile-only OAuth; set `organization` to request company page scopes.
      parameters:
        - $ref: '#/components/parameters/PlatformPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthStartRequest'
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform:
                    $ref: '#/components/schemas/OAuthPlatform'
                  auth_url:
                    type: string
                  state:
                    type: string
                  expires:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Error'

  /oauth/{platform}/callback:
    get:
      summary: Complete OAuth and create/update account(s)
      description: Supported OAuth platforms are x, linkedin, facebook, and instagram.
      parameters:
        - $ref: '#/components/parameters/PlatformPath'
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connected accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform:
                    $ref: '#/components/schemas/OAuthPlatform'
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error'

  /login:
    get:
      summary: Render the local owner login page
      responses:
        '200':
          description: HTML login page

    post:
      summary: Create a local owner web session
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                return_to:
                  type: string
      responses:
        '303':
          description: Redirect to the requested HTML page after login
        '400':
          $ref: '#/components/responses/Error'

  /logout:
    post:
      summary: Destroy the current local owner web session
      responses:
        '303':
          description: Redirect back to login

  /.well-known/oauth-authorization-server:
    get:
      summary: Local OAuth server metadata for ChatGPT and other remote MCP clients
      description: Advertises the local MCP OAuth server, including support for the `mcp` and `offline_access` scopes.
      responses:
        '200':
          description: Authorization server metadata

  /.well-known/oauth-protected-resource:
    get:
      summary: Protected resource metadata for the MCP endpoint
      description: Used by remote MCP clients after an unauthenticated MCP probe to discover how to authorize against `/mcp`.
      responses:
        '200':
          description: Protected resource metadata

  /oauth/register:
    post:
      summary: Register a public OAuth client for the local MCP server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Registered OAuth client
        '400':
          $ref: '#/components/responses/Error'

  /authorize:
    get:
      summary: Authorize a registered OAuth client using the current owner web session
      description: If the owner is not logged in yet, PostFlow redirects to `/login` first and then resumes the OAuth flow.
      parameters:
        - in: query
          name: response_type
          required: true
          schema:
            type: string
            enum: [code]
        - in: query
          name: client_id
          required: true
          schema:
            type: string
        - in: query
          name: redirect_uri
          required: true
          schema:
            type: string
        - in: query
          name: code_challenge
          required: true
          schema:
            type: string
        - in: query
          name: code_challenge_method
          required: true
          schema:
            type: string
            enum: [S256]
        - in: query
          name: scope
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
      responses:
        '302':
          description: Redirect back to the client redirect URI with an authorization code
        '303':
          description: Redirect to local login if no owner session exists
        '400':
          $ref: '#/components/responses/Error'

  /token:
    post:
      summary: Exchange or refresh OAuth tokens for the local MCP server
      description: Returns bearer access and refresh tokens for the local MCP server. Remote MCP clients use these tokens for authenticated `tools/call` requests.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                client_id:
                  type: string
                redirect_uri:
                  type: string
                code:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: OAuth bearer token pair
        '400':
          $ref: '#/components/responses/Error'

  /media:
    post:
      summary: Upload a media file
      description: Uploads are capped at 512 MiB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                kind:
                  type: string
                  enum: [video, image]
                  default: video
                file:
                  type: string
                  format: binary
                tags:
                  type: string
                  description: Comma-separated editorial tags for later media search.
      responses:
        '201':
          description: Media created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
    get:
      summary: List uploaded media
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: tag
          schema:
            type: string
          description: Optional editorial tag filter.
      responses:
        '200':
          description: Media list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaListItem'

  /media/{id}:
    delete:
      summary: Delete media if not in use
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  media:
                    $ref: '#/components/schemas/MediaListItem'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /campaigns:
    get:
      summary: List editorial campaigns
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/CampaignStatus'
        - in: query
          name: tag
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Campaign list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'
    post:
      summary: Create an editorial campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignInput'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/Error'

  /campaigns/{id}:
    post:
      summary: Update an editorial campaign
      parameters:
        - $ref: '#/components/parameters/CampaignID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CampaignInput'
                - type: object
                  properties:
                    status:
                      $ref: '#/components/schemas/CampaignStatus'
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /campaigns/{id}/archive:
    post:
      summary: Archive an editorial campaign
      parameters:
        - $ref: '#/components/parameters/CampaignID'
      responses:
        '200':
          description: Campaign archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          $ref: '#/components/responses/Error'

  /campaigns/{id}/posts:
    post:
      summary: Add an existing post to a campaign
      parameters:
        - $ref: '#/components/parameters/CampaignID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_id]
              properties:
                post_id:
                  type: string
                editorial_status:
                  $ref: '#/components/schemas/EditorialStatus'
                requires_approval:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Linked post
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/Error'

  /campaigns/{id}/drafts:
    post:
      summary: Generate campaign draft variants
      description: Generates platform-aware draft posts from the campaign brief and links them to the campaign.
      parameters:
        - $ref: '#/components/parameters/CampaignID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  description: Convenience single-account field. Ignored when account_ids is provided.
                account_ids:
                  type: array
                  items:
                    type: string
                idea:
                  type: string
                variants_per_post:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                brand_profile_id:
                  type: string
                brand_profile:
                  type: string
                  description: Optional brand profile name. Ignored when brand_profile_id is provided.
                generate_images:
                  type: boolean
                  description: When true, generate and attach a related campaign image for each draft.
                image_prompt:
                  type: string
                  description: Optional visual prompt override for generated campaign images.
                image_size:
                  type: string
                  description: Optional image size override, for example 1024x1024.
                editorial_status:
                  $ref: '#/components/schemas/EditorialStatus'
                requires_approval:
                  type: boolean
                  default: true
                tags:
                  type: array
                  items:
                    type: string
                idempotency_prefix:
                  type: string
      responses:
        '201':
          description: Draft variants created
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: '#/components/schemas/Campaign'
                  created_count:
                    type: integer
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /campaigns/{id}/calendar-drafts:
    post:
      summary: Generate a campaign editorial calendar
      description: Generates reviewable draft posts for multiple days and returns planned_at slots without scheduling the posts for publication.
      parameters:
        - $ref: '#/components/parameters/CampaignID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                account_ids:
                  type: array
                  items:
                    type: string
                idea:
                  type: string
                from:
                  type: string
                  format: date-time
                days:
                  type: integer
                  minimum: 1
                  maximum: 31
                  default: 7
                posts_per_day:
                  type: integer
                  minimum: 1
                  maximum: 10
                slots:
                  type: array
                  description: HH:MM local slots such as ["09:00", "17:00"].
                  items:
                    type: string
                brand_profile_id:
                  type: string
                brand_profile:
                  type: string
                generate_images:
                  type: boolean
                  description: When true, generate and attach a related campaign image for each draft.
                image_prompt:
                  type: string
                  description: Optional visual prompt override for generated campaign images.
                image_size:
                  type: string
                  description: Optional image size override, for example 1024x1024.
                editorial_status:
                  $ref: '#/components/schemas/EditorialStatus'
                requires_approval:
                  type: boolean
                  default: true
                tags:
                  type: array
                  items:
                    type: string
                idempotency_prefix:
                  type: string
      responses:
        '201':
          description: Calendar draft plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: '#/components/schemas/Campaign'
                  created_count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        planned_at:
                          type: string
                          format: date-time
                        post:
                          $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /editorial/backlog:
    get:
      summary: List editorial backlog items
      parameters:
        - in: query
          name: campaign_id
          schema:
            type: string
        - in: query
          name: platform
          schema:
            $ref: '#/components/schemas/Platform'
        - in: query
          name: editorial_status
          schema:
            $ref: '#/components/schemas/EditorialStatus'
        - in: query
          name: tag
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Editorial backlog
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EditorialBacklogItem'

  /posts:
    post:
      summary: Create a draft or scheduled post
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Post'
                  - $ref: '#/components/schemas/CreatePostBatchResponse'
        '200':
          description: Idempotent replay (existing post)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Post'
                  - $ref: '#/components/schemas/CreatePostBatchResponse'
        '400':
          $ref: '#/components/responses/Error'

  /posts/validate:
    post:
      summary: Validate a post without persisting it (dry-run)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: Validation succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  normalized:
                    type: object
                    properties:
                      account_id:
                        type: string
                      platform:
                        $ref: '#/components/schemas/Platform'
                      text:
                        type: string
                      scheduled_at:
                        type: string
                        format: date-time
                      media_ids:
                        type: array
                        items:
                          type: string
                      segments:
                        type: array
                        items:
                          $ref: '#/components/schemas/ThreadSegmentInput'
                      max_attempts:
                        type: integer
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/Error'

  /posts/{id}/cancel:
    post:
      summary: Cancel a scheduled post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post canceled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    example: canceled
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /posts/{id}/schedule:
    post:
      summary: Schedule a draft post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_at]
              properties:
                scheduled_at:
                  type: string
                  description: RFC3339 or datetime-local value in UI timezone
      responses:
        '200':
          description: Post scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    example: scheduled
                  post:
                    $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /posts/{id}/approve:
    post:
      summary: Approve a post for editorial scheduling
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    $ref: '#/components/schemas/EditorialStatus'
                  post:
                    $ref: '#/components/schemas/Post'
        '409':
          $ref: '#/components/responses/Error'

  /posts/{id}/preview-schedule:
    post:
      summary: Preview scheduling guardrails without mutating the post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_at:
                  type: string
                  format: date-time
                scheduled_at_local:
                  type: string
                  description: Datetime-local value parsed in the configured UI timezone.
      responses:
        '200':
          description: Normalized scheduling preview with warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePreview'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /posts/{id}/edit:
    post:
      summary: Edit an editable post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: >
                Use `text` + `media_ids` for a single editable post, or `segments` to replace an
                editable thread while keeping the same root post.
              oneOf:
                - required: [text]
                - required: [segments]
              type: object
              properties:
                text:
                  type: string
                  description: Root post text for single-post edits.
                intent:
                  type: string
                  description: Optional mode override (draft|schedule|publish_now)
                scheduled_at:
                  type: string
                  description: Optional RFC3339 or datetime-local value in UI timezone. If omitted with empty intent, current scheduling is preserved.
                media_ids:
                  type: array
                  items:
                    type: string
                  description: Optional replacement media IDs. Pass an empty array to remove all media.
                segments:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/ThreadSegmentInput'
      responses:
        '200':
          description: Post edited
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  post:
                    $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /posts/{id}/delete:
    post:
      summary: Delete an editable post (not published/publishing)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /drafts:
    get:
      summary: List draft posts (no scheduled date)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Draft list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  drafts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'

  /schedule:
    get:
      summary: List scheduled publications by range
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: view
          schema:
            type: string
            enum: [publications, posts]
            default: publications
      responses:
        '200':
          description: Schedule list
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  count:
                    type: integer
                  items:
                    oneOf:
                      - type: array
                        items:
                          $ref: '#/components/schemas/Publication'
                      - type: array
                        items:
                          $ref: '#/components/schemas/Post'

  /dlq:
    get:
      summary: List dead-letter queue entries
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: DLQ item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeadLetter'

  /dlq/requeue:
    post:
      summary: Requeue multiple DLQ entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Bulk requeue result
          content:
            application/json:
              schema:
                type: object
                properties:
                  selected:
                    type: integer
                  success:
                    type: integer
                  failed:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'

  /dlq/delete:
    post:
      summary: Delete multiple DLQ entries and their failed posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Bulk delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  selected:
                    type: integer
                  success:
                    type: integer
                  failed:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'

  /dlq/{id}/requeue:
    post:
      summary: Requeue one post from DLQ
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  dead_letter_id:
                    type: string
                  post:
                    $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /dlq/{id}/delete:
    post:
      summary: Delete one DLQ entry and its failed post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  dead_letter_id:
                    type: string
                  deleted:
                    type: boolean
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /settings/timezone:
    post:
      summary: Set UI timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone:
                  type: string
                  example: Europe/Madrid
      responses:
        '200':
          description: Timezone updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
        '400':
          $ref: '#/components/responses/Error'

  /settings/smtp:
    post:
      summary: Configure SMTP publish failure notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, host, port, from, to]
              properties:
                enabled:
                  type: boolean
                host:
                  type: string
                  example: smtp.sendgrid.net
                port:
                  type: integer
                  example: 587
                username:
                  type: string
                  example: apikey
                password:
                  type: string
                  description: SMTP password. Omit or leave empty with keep_password=true to preserve the current encrypted password.
                keep_password:
                  type: boolean
                from:
                  type: string
                  format: email
                to:
                  type: string
                  format: email
                subject_prefix:
                  type: string
                  example: PostFlow publish failed
                use_tls:
                  type: boolean
                  description: Use implicit TLS, usually port 465.
                start_tls:
                  type: boolean
                  description: Use STARTTLS, usually port 587.
      responses:
        '200':
          description: SMTP notification configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  host:
                    type: string
                  port:
                    type: integer
                  username:
                    type: string
                  password_configured:
                    type: boolean
                  from:
                    type: string
                  to:
                    type: string
                  subject_prefix:
                    type: string
                  use_tls:
                    type: boolean
                  start_tls:
                    type: boolean
                  configured:
                    type: boolean
                  ready:
                    type: boolean
                  missing_requirements:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/Error'

  /settings/smtp/test:
    post:
      summary: Save SMTP settings and send a test email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, port, from, to]
              properties:
                enabled:
                  type: boolean
                host:
                  type: string
                  example: smtp.sendgrid.net
                port:
                  type: integer
                  example: 587
                username:
                  type: string
                  example: apikey
                password:
                  type: string
                  description: SMTP password. Omit or leave empty with keep_password=true to preserve the current encrypted password.
                keep_password:
                  type: boolean
                from:
                  type: string
                  format: email
                to:
                  type: string
                  format: email
                subject_prefix:
                  type: string
                  example: PostFlow publish failed
                use_tls:
                  type: boolean
                start_tls:
                  type: boolean
      responses:
        '200':
          description: SMTP test email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  host:
                    type: string
                  port:
                    type: integer
                  username:
                    type: string
                  password_configured:
                    type: boolean
                  from:
                    type: string
                  to:
                    type: string
                  subject_prefix:
                    type: string
                  use_tls:
                    type: boolean
                  start_tls:
                    type: boolean
                  configured:
                    type: boolean
                  ready:
                    type: boolean
                  missing_requirements:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    basicAuth:
      type: http
      scheme: basic

  parameters:
    AccountID:
      in: path
      name: id
      required: true
      schema:
        type: string
    PlatformPath:
      in: path
      name: platform
      required: true
      schema:
        $ref: '#/components/schemas/OAuthPlatform'
    CampaignID:
      in: path
      name: id
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Validation or business error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  schemas:
    Platform:
      type: string
      enum: [x, linkedin, facebook, instagram]

    OAuthPlatform:
      type: string
      enum: [x, linkedin, facebook, instagram]

    Account:
      type: object
      properties:
        id:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        account_kind:
          $ref: '#/components/schemas/AccountKind'
        display_name:
          type: string
        external_account_id:
          type: string
        auth_method:
          type: string
          enum: [static, oauth]
        status:
          type: string
          enum: [connected, disconnected, error]
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateStaticAccountRequest:
      type: object
      required: [platform, external_account_id, credentials]
      description: Static accounts are supported for linkedin, facebook, and instagram. X accounts must connect via OAuth.
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        account_kind:
          $ref: '#/components/schemas/AccountKind'
        display_name:
          type: string
        external_account_id:
          type: string
        credentials:
          type: object
          additionalProperties: true

    AccountKind:
      type: string
      enum: [default, personal, organization]

    OAuthStartRequest:
      type: object
      properties:
        account_kind:
          $ref: '#/components/schemas/AccountKind'
      description: Optional for LinkedIn OAuth. Defaults to `personal`; use `organization` to request company page scopes.

    CampaignStatus:
      type: string
      enum: [active, paused, archived]

    EditorialStatus:
      type: string
      enum: [idea, drafting, needs_review, approved, scheduled]

    CampaignInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        objective:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        timezone:
          type: string
          example: Europe/Madrid
        audience:
          type: string
        tone:
          type: string
        cta:
          type: string
        restrictions:
          type: string
        brand_profile_id:
          type: string
          description: Stored brand profile ID used as the campaign default for draft generation.
        brand_profile:
          type: string
          description: Optional brand profile name accepted on create/update. The server resolves and stores brand_profile_id.

    Campaign:
      allOf:
        - $ref: '#/components/schemas/CampaignInput'
        - type: object
          properties:
            id:
              type: string
            status:
              $ref: '#/components/schemas/CampaignStatus'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    EditorialBacklogItem:
      type: object
      properties:
        post_id:
          type: string
        campaign_id:
          type: string
        campaign_name:
          type: string
        account_id:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        text:
          type: string
        post_status:
          type: string
          enum: [draft, scheduled, publishing, published, failed, canceled]
        editorial_status:
          $ref: '#/components/schemas/EditorialStatus'
        requires_approval:
          type: boolean
        approved_at:
          type: string
          format: date-time
          nullable: true
        scheduled_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string

    SchedulePreview:
      type: object
      properties:
        post_id:
          type: string
        account_id:
          type: string
        account_name:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        text:
          type: string
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        campaign_id:
          type: string
        campaign_name:
          type: string
        scheduled_at:
          type: string
          format: date-time
        scheduled_local:
          type: string
          format: date-time
        timezone:
          type: string
        warnings:
          type: array
          description: Guardrail warnings such as approval required, archived campaign, nearby account conflict, or recent duplicate text.
          items:
            type: string

    CreatePostRequest:
      type: object
      required: [account_id]
      description: >
        Backward compatible payload. Use `text` + `media_ids` for single post, or `segments` for
        thread creation/editing. When `segments` is present, `text`/`media_ids` are treated as legacy
        compatibility fields and the first segment is used as canonical root content.
      oneOf:
        - required: [text]
        - required: [segments]
      properties:
        account_id:
          type: string
        account_ids:
          type: array
          items:
            type: string
          description: Optional multi-account fanout. If omitted, `account_id` is used.
        text:
          type: string
          description: Root post text for legacy single-post payloads.
        scheduled_at:
          type: string
          format: date-time
          description: Optional. Empty value creates a draft.
        campaign_id:
          type: string
          description: Optional editorial campaign association. Archived campaigns reject create/schedule operations.
        editorial_status:
          $ref: '#/components/schemas/EditorialStatus'
        requires_approval:
          type: boolean
          description: When true, the post must be approved before scheduling.
        tags:
          type: array
          items:
            type: string
        max_attempts:
          type: integer
          minimum: 1
          default: 3
        media_ids:
          type: array
          items:
            type: string
          description: Legacy root media IDs for single-post payloads.
        segments:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ThreadSegmentInput'

    ThreadSegmentInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
        media_ids:
          type: array
          items:
            type: string

    CreatePostBatchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        created_count:
          type: integer
        total:
          type: integer
        root_id:
          type: string
          nullable: true
        total_steps:
          type: integer
          nullable: true

    Media:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        original_name:
          type: string
        storage_path:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        usage_count:
          type: integer
        in_use:
          type: boolean
        preview_url:
          type: string
        tags:
          type: array
          items:
            type: string

    MediaListItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        original_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        usage_count:
          type: integer
        in_use:
          type: boolean
        preview_url:
          type: string
        tags:
          type: array
          items:
            type: string

    Post:
      type: object
      properties:
        id:
          type: string
        account_id:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        text:
          type: string
        status:
          type: string
          enum: [draft, scheduled, publishing, published, failed, canceled]
        scheduled_at:
          type: string
          format: date-time
        campaign_id:
          type: string
        editorial_status:
          $ref: '#/components/schemas/EditorialStatus'
        requires_approval:
          type: boolean
        approved_at:
          type: string
          format: date-time
          nullable: true
        tags:
          type: array
          items:
            type: string
        thread_group_id:
          type: string
        thread_position:
          type: integer
        parent_post_id:
          type: string
          nullable: true
        root_post_id:
          type: string
          nullable: true
        next_retry_at:
          type: string
          format: date-time
          nullable: true
        attempts:
          type: integer
        max_attempts:
          type: integer
        idempotency_key:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        external_id:
          type: string
          nullable: true
        published_url:
          type: string
          nullable: true
        error:
          type: string
    PublicationSegment:
      type: object
      properties:
        post_id:
          type: string
        position:
          type: integer
        text:
          type: string
        media_count:
          type: integer
        media_ids:
          type: array
          items:
            type: string

    Publication:
      type: object
      properties:
        publication_id:
          type: string
        root_post_id:
          type: string
        thread_group_id:
          type: string
        account_id:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        status:
          type: string
          enum: [draft, scheduled, publishing, published, failed, canceled]
        scheduled_at:
          type: string
          format: date-time
        segment_count:
          type: integer
        media_count:
          type: integer
        has_media:
          type: boolean
        segments:
          type: array
          items:
            $ref: '#/components/schemas/PublicationSegment'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaListItem'

    DeadLetter:
      type: object
      properties:
        id:
          type: string
        post_id:
          type: string
        reason:
          type: string
        last_error:
          type: string
        attempted_at:
          type: string
          format: date-time
